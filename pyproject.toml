[project]
name = "RAG-against-the-machine"
version = "0.1.0"
description = "Retrieval augmented generation, RAG. Giving a language model access to an external knowledge base to pull from during answer time"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
			"pydantic>=2.0",
			"transformers>=4.40.0",
			"huggingface-hub>=0.20.0",
			"fire>=0.6.0",
			"tqdm>=4.66.0",
			"torch>=2.2.0",
			"BM25>=0.3.10",
			"bm25s>=0.3.10"
]

[dependency-groups]
dev = [
	"flake8>=6.0",
	"mypy>=1.5",
	"pytest>=7.0"
]

[tool.uv]
package = false

[tool.mypy]
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ['^docs/', '^llm_sdk/', '\.artifacts/', '^build/']

[[tool.mypy.overrides]]
module = [
	"llm_sdk", "llm_sdk.*",
	"torch", "torch.*",
	"transformers", "transformers.*",
	"huggingface_hub", "huggingface_hub.*",
	"tqdm", "tqdm.*"

]

ignore_missing_imports = true
ignore_errors = true
follow_imports = "skip"
